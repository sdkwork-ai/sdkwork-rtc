# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/rtc/webserver.pid;
error_log /var/log/sdkwork/rtc/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name rtc-demo.sdkwork.com rtc-demo.birdcoder.com rtc-demo.dtupay.com rtc-demo.noaper.com rtc-demo.sdkwork.cn rtc-demo.birdcoder.cn rtc-demo.dtupay.cn rtc-demo.noaper.cn rtc-demo.skubc.com rtc-demo.skubc.cn rtc-demo.zowalk.com rtc-demo.zowalk.cn rtc-demo.offer86.com rtc-demo.offer86.cn rtc-demo.86offer.com rtc-demo.86offer.cn;
        include snippets/adaptive-web.named-locations.conf;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            include snippets/adaptive-web.dispatch.conf;
        }
    }
}
